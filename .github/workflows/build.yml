name: Build release artifacts
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Build (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: tm-mumble-link
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: tm-mumble-link.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: python -m unittest discover -s tests -p 'test_release.py' -v
      - run: python scripts/release.py metadata
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test the Linux release binary
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tests/linux_smoke.py target/${{ matrix.target }}/release/tm-mumble-link
      - name: Package binary, documentation, license, and checksum
        run: python scripts/release.py package --platform ${{ matrix.platform }} --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: tm-mumble-link-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
